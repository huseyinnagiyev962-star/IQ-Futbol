.opts{display:grid;gap:10px}

.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px;min-height:56px}
.opt b{background:var(--pri);color:#fff;border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center}

.opt.show{outline:3px solid var(--gl)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--no);color:#fff;border-color:var(--no)}

.big{text-align:center;padding:24px 8px}

.rules{text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px 16px 12px 32px;font-size:.92rem}

body.lobby,body.gm,body.sc{background:radial-gradient(ellipse at 8% 20%,rgba(255,255,255,.25),transparent 14%),radial-gradient(ellipse at 92% 20%,rgba(255,255,255,.25),transparent 14%),linear-gradient(180deg,#03140f 0%,#0a3a26 55%,#0b4a2c 72%,#06281a 100%);color:#fff}
body.lobby header,body.sc header{display:none}
.lb{position:relative;padding:24px 4px 32px;display:flex;flex-direction:column;align-items:center;gap:22px}
.lt{margin:0;padding-right:76px;font-size:2rem;line-height:1.15;align-self:stretch;text-align:center}

.rb{width:56px;height:56px;border-radius:50%;border:0;background:#eef3f6;color:#0a2a1f;font-size:1.6rem;font-weight:900;box-shadow:0 0 14px rgba(120,255,210,.35)}

.lr{font-size:1.35rem;font-weight:800;text-align:center}
